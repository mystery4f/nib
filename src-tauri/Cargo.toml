[package]
name = "nib"
version = "0.2.0"
description = "A small markdown editor for pi's $EDITOR"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
